<g transform="translate(1010 140)"><rect width="430" height="570" rx="12" fill="#fff" stroke="#d6d8d9"/><text x="22" y="38" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#555">3. PREVISIÓN ANUAL</text><rect x="22" y="58" width="386" height="110" rx="10" fill="#3e3e41"/><circle cx="68" cy="112" r="28" fill="#f8e3de"/><path d="M51 118 Q68 76 85 118 Q68 111 51 118" fill="#ee7268"/><text x="112" y="106" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="white">Tu año como emprendedor/a</text><text x="112" y="130" font-family="Segoe UI,Arial" font-size="11" fill="#e1e1e1">Tienda Canarias</text><rect x="22" y="184" width="386" height="90" rx="9" fill="#f7f8f8" stroke="#e6e7e8"/><rect x="22" y="285" width="386" height="140" rx="9" fill="#f7f8f8" stroke="#e6e7e8"/><g fill="#80c9a1"><rect x="58" y="366" width="22" height="40"/><rect x="94" y="336" width="22" height="70"/><rect x="130" y="348" width="22" height="58"/><rect x="166" y="322" width="22" height="84"/></g><text x="22" y="520" font-family="Segoe UI,Arial" font-size="15" fill="#606064">Logo en la cabecera; gráficos intactos.</text></g>
<text x="60" y="765" font-family="Segoe UI,Arial" font-size="16" fill="#555">Sin logo, la cabecera seguiría como está. La disposición final podría variar según el tamaño de la imagen.</text></svg>
