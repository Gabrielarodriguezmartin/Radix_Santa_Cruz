<g transform="translate(60 140)"><rect width="430" height="570" rx="12" fill="#fff" stroke="#d6d8d9"/><text x="22" y="38" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#555">1. BUSINESS MODEL CANVAS</text><rect x="22" y="58" width="386" height="95" rx="10" fill="#3e3e41"/><circle cx="68" cy="105" r="28" fill="#f8e3de"/><path d="M51 111 Q68 69 85 111 Q68 104 51 111" fill="#ee7268"/><text x="112" y="101" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="white">Tienda Canarias</text><text x="112" y="125" font-family="Segoe UI,Arial" font-size="11" fill="#e1e1e1">Comercio · Sociedad limitada</text><g fill="#edf4ef" stroke="#d4e1d6"><rect x="22" y="165" width="73" height="205" rx="6"/><rect x="101" y="165" width="73" height="205" rx="6"/><rect x="180" y="165" width="70" height="205" rx="6"/><rect x="256" y="165" width="73" height="205" rx="6"/><rect x="335" y="165" width="73" height="205" rx="6"/><rect x="22" y="378" width="187" height="86" rx="6"/><rect x="216" y="378" width="192" height="86" rx="6"/></g><text x="22" y="520" font-family="Segoe UI,Arial" font-size="15" fill="#606064">Logo junto al nombre, sin tapar el Canvas.</text></g>
